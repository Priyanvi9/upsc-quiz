    let state = {
        idx: 0, 
        responses: new Array(50).fill(null), 
        timer: 30, 
        interval: null, 
        lang: 'en'
    };

    const startForm = document.getElementById('startForm');
    const welcomeSection = document.getElementById('welcomeSection');
    const quizSection = document.getElementById('quizSection');
    const resultsSection = document.getElementById('resultsSection');

    startForm.onsubmit = (e) => {
        e.preventDefault();
        state.lang = document.getElementById('langChoice').value;
        welcomeSection.classList.remove('active');
        quizSection.classList.add('active');
        loadQuestion();
        startTimer();
    };

    function loadQuestion() {
        const q = BANK[state.idx];
        document.getElementById('progressText').innerText = `Q ${state.idx + 1} / 50`;
        document.getElementById('questionText').innerText = (state.lang === 'hi') ? q.hi : q.en;
        
        const box = document.getElementById('optionsBox');
        box.innerHTML = '';
        
        const opts = (state.lang === 'hi') ? q.opts_hi : q.opts_en;
        opts.forEach((text, i) => {
            const div = document.createElement('div');
            div.className = 'option' + (state.responses[state.idx] === i ? ' selected' : '');
            div.innerText = text;
            div.onclick = () => {
                state.responses[state.idx] = i;
                loadQuestion();
            };
            box.appendChild(div);
        });
    }

    function startTimer() {
        state.interval = setInterval(() => {
            state.timer--;
            document.getElementById('timerText').innerText = state.timer + 's';
            if(state.timer <= 0) {
                if(state.idx < 49) {
                    state.idx++;
                    state.timer = 30;
                    loadQuestion();
                } else {
                    showResult();
                }
            }
        }, 1000);
    }

    document.getElementById('nextBtn').onclick = () => {
        if(state.idx < 49) {
            state.idx++;
            state.timer = 30;
            loadQuestion();
        } else {
            showResult();
        }
    };

    document.getElementById('prevBtn').onclick = () => {
        if(state.idx > 0) {
            state.idx--;
            state.timer = 30;
            loadQuestion();
        }
    };

    function showResult() {
        clearInterval(state.interval);
        quizSection.classList.remove('active');
        resultsSection.classList.add('active');

        let correct = 0;
        let wrong = 0;
        state.responses.forEach((ans, i) => {
            if(ans !== null) {
                if(ans === BANK[i].ans) correct++;
                else wrong++;
            }
        });

        const score = (correct * 2) - (wrong * 0.66);
        document.getElementById('scoreDisplay').innerText = score.toFixed(2);
        document.getElementById('statsText').innerText = `Correct: ${correct} | Wrong: ${wrong} | Unattempted: ${50 - (correct + wrong)}`;
    }
</script>
